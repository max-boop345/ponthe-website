<!--Header-->
{% load static %}

<script>
    // Check if user is authentificated or not
    {% if user.is_authenticated %}
        is_authenticated = true;
    {% else %}
        is_authenticated = false;
    {% endif %}

    // Shows the "Gestion" link: staff or superuser, as in api.permissions.is_manager
    {% if user.is_staff or user.is_superuser %}
        is_staff = true;
    {% else %}
        is_staff = false;
    {% endif %}

    // Check if user is admin or not
    {% if user.is_superuser %}
        is_superuser = true;
    {% else %}
        is_superuser = false;
    {% endif %}
</script>
