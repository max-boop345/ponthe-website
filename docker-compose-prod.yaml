version: "3.6"

# Shared by `back` and `celery-worker`: a variable added here reaches both.
x-back-environment: &back-environment
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG}
  DOMAIN_NAME: ${DOMAIN_NAME}
  GUNICORN_NB_WORKERS: ${GUNICORN_NB_WORKERS}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT}
  TRUSTED_ORIGIN: ${TRUSTED_ORIGIN}
  CAS_SERVER_URL: ${CAS_SERVER_URL:-https://idp.enpc.fr/cas/}

services:
  db:
    image: postgres:13.12-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    volumes:
      - ./database:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - db_link
    healthcheck:
        test: pg_isready -U ${DB_USER}
        interval: 5s
        timeout: 3s
        retries: 5

  redis:
    image: redis:7.2.2-bookworm
    command: redis-server --save 60 1 --loglevel notice --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - cache:/data
    networks:
      - cache_link
    healthcheck:
        test: echo 'auth ${REDIS_PASSWORD}\nping' | redis-cli | grep PONG
        interval: 5s
        timeout: 3s
        retries: 5

  back:
    build:
      context: back
      dockerfile: Dockerfile
      target: production
    # One image for `back` and `celery-worker`: building either refreshes both.
    image: ponthe-back
    command: gunicorn galerie.wsgi:application --bind 0.0.0.0:8000
    environment: *back-environment
    restart: always
    volumes:
      - bundles:/src/galerie/static/react
      - static_volume:/src/static
      - ./back/media:/src/media
      - ./backups:/backups
    networks:
      - db_link
      - cache_link
      - nginx_link
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      webinstaller:
        condition: service_completed_successfully

  # The worker used to be started in the background by the entrypoint of `back`:
  # when it died nothing restarted it, and uploads were accepted but never
  # processed. As its own service it is restarted and shows up in `docker ps`.
  celery-worker:
    build:
      context: back
      dockerfile: Dockerfile
      target: production
    image: ponthe-back
    entrypoint: ["celery", "-A", "galerie", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *back-environment
    restart: always
    volumes:
      - ./back/media:/src/media
    networks:
      - db_link
      - cache_link
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
        test: celery -A galerie inspect ping -d celery@$$HOSTNAME
        interval: 60s
        timeout: 20s
        retries: 3

  nginx:
    build: nginx
    ports:
      - "127.0.0.1:$BACK_PORT:80"
    restart: always
    volumes:
      - static_volume:/src/static
      - ./back/media:/src/media
    networks:
      - nginx_link
    depends_on:
      - back

  webinstaller:
    build:
      context: .
      dockerfile: ./webinstaller/Dockerfile
      target: production
    # It only needs to reach the npm registry: Docker's own bridge will do, and
    # the project then has no `default` network to create.
    network_mode: bridge
    volumes:
      - bundles:/react

volumes:
  static_volume:
  cache:
  bundles:

networks:
  cache_link:
  db_link:
  nginx_link:
