version: "3.6"

# Shared by `back` and `celery-worker`: a variable added here reaches both.
x-back-environment: &back-environment
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  DEBUG: ${DEBUG}
  DOMAIN_NAME: ${DOMAIN_NAME}
  TRUSTED_ORIGIN: ${TRUSTED_ORIGIN}
  CAS_SERVER_URL: ${CAS_SERVER_URL:-https://idp.enpc.fr/cas/}

services:
  db:
    image: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    volumes:
      - ./database:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - db_link
    healthcheck:
        test: pg_isready -U ${DB_USER}
        interval: 5s
        timeout: 3s
        retries: 5

  redis:
    image: redis:7.2.2-bookworm
    command: redis-server --save 60 1 --loglevel notice --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - cache:/data
    networks:
      - cache_link
    healthcheck:
        test: echo 'auth ${REDIS_PASSWORD}\nping' | redis-cli | grep PONG
        interval: 5s
        timeout: 3s
        retries: 5

  back:
    build:
      context: back
      dockerfile: Dockerfile
      target: development
    image: ponthe-back-dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "$BACK_PORT:8000"
    environment: *back-environment
    restart: always
    volumes:
      - bundles:/src/galerie/static/react
      - ./back:/src
      - ./backups:/backups
    networks:
      - db_link
      - cache_link
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery-worker:
    build:
      context: back
      dockerfile: Dockerfile
      target: development
    image: ponthe-back-dev
    entrypoint: ["celery", "-A", "galerie", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *back-environment
    restart: always
    volumes:
      - ./back:/src
    networks:
      - db_link
      - cache_link
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  webinstaller:
    build:
      context: webinstaller
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./react:/app/
      - bundles:/react

volumes:
  cache:
  bundles:

networks:
  cache_link:
  db_link:
